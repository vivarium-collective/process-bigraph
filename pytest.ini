[pytest]
# Collect ONLY real test files. `*.py` (the old value) made pytest import every
# source module at collection time, so a single optional/heavy top-level import
# in application code (e.g. `from fastapi import FastAPI` in server/rest.py, only
# present with the [server-rest] extra) aborted the ENTIRE suite with a collection
# error for anyone who hadn't installed every optional dependency. All tests live
# in test_*.py / *_test.py / the root tests.py, so this loses no tests.
python_files = test_*.py *_test.py tests.py
python_functions = test*
markers =
    slow: tests that take significant wall-time (Ray cluster spin-up, REST/FastAPI, large simulations). Skipped by default; opt in with --run-slow.
